[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somora-realtimevoice"
dynamic = ["version"]
description = "Local OpenAI Realtime-compatible voice server for somora, with pluggable HTTP STT/LLM/TTS backends."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "emoji>=2.15,<3",
  "python-multipart>=0.0.9",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "starlette>=0.37",
]

[project.scripts]
realtimevoice = "realtimevoice.server:main"
somora-realtimevoice = "realtimevoice.server:main"

[tool.hatch.version]
path = "src/realtimevoice/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/realtimevoice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
faulthandler_timeout = 20

[tool.ruff]
line-length = 100
